events {}
http {
  upstream backend {
    server web1:3000 max_fails=1 fail_timeout=5s;
    server web2:3000 max_fails=1 fail_timeout=5s;
    server web3:3000 max_fails=1 fail_timeout=5s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://backend;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout;
    }
  }
}
