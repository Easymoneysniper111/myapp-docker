services:
  web1:
    build: .
    ports:
      - "8080:3000"
    container_name: myapp-web1
    environment:
      - MONGO_URL=mongodb://db:27017/myappdb
    depends_on:
      - db
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web2:
    build: .
    ports:
      - "8081:3000"
    container_name: myapp-web2
    environment:
      - MONGO_URL=mongodb://db:27017/myappdb
    depends_on:
      - db
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web3:
    build: .
    ports:
      - "8082:3000"
    container_name: myapp-web3
    environment:
      - MONGO_URL=mongodb://db:27017/myappdb
    depends_on:
      - db
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: mongo:6
    container_name: myapp-db
    volumes:
      - mongo-data:/data/db
    restart: always

  nginx:
    image: nginx:alpine
    container_name: myapp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
      - web3
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: myapp-portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    restart: always

volumes:
  mongo-data:
  portainer-data:
