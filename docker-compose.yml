version: '3'
services:
  web1:
    build: .
    ports:
      - "8080:3000"
    container_name: myapp-web1
    environment:
      - MONGO_URL=mongodb://db:27017/myappdb
    depends_on:
      - db

  web2:
    build: .
    ports:
      - "8081:3000"
    container_name: myapp-web2
    environment:
      - MONGO_URL=mongodb://db:27017/myappdb
    depends_on:
      - db

  web3:
    build: .
    ports:
      - "8082:3000"
    container_name: myapp-web3
    environment:
      - MONGO_URL=mongodb://db:27017/myappdb
    depends_on:
      - db

  db:
    image: mongo:6
    container_name: myapp-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
